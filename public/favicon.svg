<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="kb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="kb-pulse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="kb-route" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="kb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="120" height="120" rx="30" fill="url(#kb-bg)"/>

  <!-- Topography Radar Concentric Rings -->
  <circle cx="60" cy="60" r="44" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.6"/>
  <circle cx="60" cy="60" r="30" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.4"/>
  <circle cx="60" cy="60" r="17" stroke="#F97316" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Fluid Bypass Highway Route -->
  <path d="M 18 96 C 42 82, 50 62, 60 60 C 70 58, 85 45, 102 24" stroke="url(#kb-route)" stroke-width="6.5" stroke-linecap="round" fill="none"/>
  
  <!-- Congestion Branch Detour -->
  <path d="M 60 60 C 66 75, 80 85, 96 90" stroke="#EF4444" stroke-width="3" stroke-dasharray="3 3" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Glowing Radar Core Beacon -->
  <circle cx="60" cy="60" r="11" fill="url(#kb-pulse)" filter="url(#kb-glow)"/>
  <circle cx="60" cy="60" r="4" fill="#FFFFFF"/>
</svg>
